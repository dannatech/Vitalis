# Render Blueprint for the Vitalis API. Create a new Blueprint deploy at
# https://dashboard.render.com pointing at this repo and Render will read
# this file. Secrets (marked sync: false) are left blank here on purpose —
# fill them in from the Render dashboard, never commit real secrets.
services:
  - type: web
    name: vitalis-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_ACCESS_TOKEN_TTL
        value: 15m
      - key: JWT_REFRESH_TOKEN_TTL
        value: 7d
      # Supabase connection string (Direct connection, port 5432) — reuse the
      # exact same one you used for `prisma migrate dev` / `npm run seed`
      # locally, so Render reads the same database and users.
      - key: DATABASE_URL
        sync: false
      # Generate fresh for production, e.g.:
      # node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"
      - key: JWT_SECRET
        sync: false
      # MUST match exactly the FIELD_ENCRYPTION_KEY you used locally when you
      # ran the seed script — it decrypts NIN/phone fields already written
      # with that key. A different key will fail to decrypt existing rows.
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      # Your GitHub Pages origin, e.g. https://dannatech.github.io
      - key: CORS_ORIGINS
        sync: false
